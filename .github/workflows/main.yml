name: ML Project CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests
        run: |
          if [ -d "tests" ]; then
            pytest tests
          fi
        continue-on-error: false

      - name: Train model (optional)
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -f "train.py" ]; then
            python train.py
          fi

      - name: Save trained model artifact (optional)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: path/to/your/model_output/

      # Example: Deploy to Hugging Face or upload to a server, S3, etc.
      # - name: Deploy model (custom step)
      #   run: |
      #     echo "Deploying model..."
      #     # Custom deployment logic here


